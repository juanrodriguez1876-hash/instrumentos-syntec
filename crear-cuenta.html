<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta | Instrumentos Sintek</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
  <script src="layout.js"></script>
  <script src="app.js" defer></script>
</head>
<body class="pagina-tarjeta">
  <main class="contenido">
    <section class="tarjeta-login">
      <div class="encabezado-tarjeta"><svg viewBox="0 0 64 72" aria-hidden="true"><defs><linearGradient id="mt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f7fc"/><stop offset=".3" stop-color="#b8c2d6"/><stop offset=".52" stop-color="#e8edf6"/><stop offset=".78" stop-color="#a3aec4"/><stop offset="1" stop-color="#dfe5f0"/></linearGradient></defs><path d="M32 2C14 2 4 14 4 30c0 16 16 30 28 40 12-10 28-24 28-40C60 14 50 2 32 2Z" fill="url(#mt)"/><text x="32" y="40" text-anchor="middle" font-size="22" font-weight="600" fill="#0f1d44" font-family="Oswald, Arial, sans-serif">IS</text></svg><h1 class="titulo">Crear cuenta</h1></div>
      <form data-aviso="Cuenta creada" data-destino="index.html">
        <div class="campo"><label for="nombre">Nombre completo</label><input type="text" id="nombre" placeholder="Nombre y apellidos" required></div>
        <div class="campo"><label for="correo">Correo electrónico</label><input type="email" id="correo" placeholder="correo@ejemplo.com" required></div>
        <div class="campo"><label for="pass">Contraseña</label><input type="password" id="pass" minlength="8" required></div>
        <div class="campo"><label for="conf">Confirmar contraseña</label><input type="password" id="conf" minlength="8" required></div>
        <div class="campo"><label for="rol">Rol en el sistema</label><select id="rol"><option>Administrador</option><option>Empleado</option></select></div>
        <div class="acciones"><a href="index.html" class="boton boton--contorno">Cancelar</a><button type="submit" class="boton">Registrar</button></div>
      </form>
    </section>
  </main>
</body>
</html>
