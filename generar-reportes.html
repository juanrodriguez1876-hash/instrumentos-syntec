<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generar reportes | Instrumentos Sintek</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
  <script src="layout.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="contenido">
    <h1 class="titulo">Generar reportes</h1>
    <p class="subtitulo">Selecciona el tipo y el rango de fechas</p>
    <form class="tarjeta-form" style="max-width:520px" data-aviso="Reporte generado" data-destino="inicio.html">
      <div class="campo"><label for="tipo">Tipo de reporte *</label><select id="tipo"><option>Ventas</option><option>Inventario</option><option>Empleados</option><option>Devoluciones</option></select></div>
      <div class="doble"><div class="campo"><label for="f1">Fecha compra *</label><input id="f1" type="date" value="2026-12-01" required></div><div class="campo"><label for="f2">Fecha devolución *</label><input id="f2" type="date" value="2026-12-03" required></div></div>
      <div class="acciones"><button type="submit" class="boton">Generar</button></div>
    </form>
  </main>
</body>
</html>
