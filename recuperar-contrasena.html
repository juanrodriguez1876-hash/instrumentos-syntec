<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recuperar contraseña | Instrumentos Sintek</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
  <script src="layout.js"></script>
</head>
<body class="pagina-login">

  <main class="contenido">
    <section class="tarjeta-login">
      <h1 class="titulo">Recuperar contraseña</h1>
      <p class="nota">Escribe tu correo y te enviaremos un enlace para crear una contraseña nueva.</p>
      <!-- Más adelante el servidor enviará el correo con el enlace. -->
      <form action="index.html" method="post">
      <div class="campo"><label for="correo">Correo electrónico <span class="requerido" aria-hidden="true">*</span></label><input type="email" id="correo" name="correo" required autocomplete="email"></div>
        <div class="acciones">
          <button type="submit" class="boton">Enviar enlace</button>
          <a href="index.html" class="boton boton--contorno">Regresar</a>
        </div>
      </form>
    </section>
  </main>

</body>
</html>
