<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrar venta | Instrumentos Sintek</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
  <script src="layout.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="contenido">
    <h1 class="titulo">Registrar venta</h1>
    <p class="subtitulo">Nueva venta</p>
    <div class="doble">
      <div class="campo"><label for="folio">Folio de venta</label><input id="folio" value="#1048"></div>
      <div class="campo"><label for="fecha">Fecha</label><input id="fecha" value="31/10/2026"></div>
    </div>
    <div class="venta">
      <div class="tabla-contenedor"><table class="tabla" aria-label="Productos de la venta">
        <thead><tr><th scope="col">Producto</th><th scope="col">Precio</th><th scope="col">Cantidad</th><th scope="col">Importe</th></tr></thead>
        <tbody>
          <tr><td>Guitarra acústica Fender CD-60</td><td>$4,890.00</td><td>1</td><td>$4,890.00</td></tr>
          <tr><td>Cuerdas D’Addario EXP16</td><td>$285.00</td><td>2</td><td>$570.00</td></tr>
          <tr><td>Púas Fender (paquete de 12)</td><td>$95.00</td><td>3</td><td>$285.00</td></tr>
        </tbody></table></div>
      <aside class="tarjeta-total">
        <dl class="totales"><div><dt>Subtotal</dt><dd>$5,745.00</dd></div><div><dt>IVA (16%)</dt><dd>$919.20</dd></div><div class="total"><dt>Total</dt><dd>$6,664.20</dd></div></dl>
        <a href="metodo-pago.html" class="boton">Continuar al pago</a>
      </aside>
    </div>
  </main>
</body>
</html>
