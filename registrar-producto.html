<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrar producto | Instrumentos Sintek</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
  <script src="layout.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="contenido">
    <h1 class="titulo">Registrar producto</h1>
    <p class="subtitulo">Inventario · Nuevo</p>
    <form class="tarjeta-form" data-aviso="Producto guardado" data-destino="gestion-inventario.html">
      <div class="linea">
        <label for="codigo">Código</label><input id="codigo" placeholder="Ej. 23564" required>
        <label for="nombre">Nombre del producto</label><input id="nombre" placeholder="Ej. Guitarra acústica" required>
        <label for="precio">Precio</label><input id="precio" type="number" min="0" step="0.01" placeholder="$0.00" required>
        <label for="cant">Cantidad inicial</label><input id="cant" type="number" min="0" placeholder="0" required>
        <div class="acciones"><a href="gestion-inventario.html" class="boton boton--contorno">Cancelar</a><button type="submit" class="boton">Guardar</button></div>
      </div>
    </form>
  </main>
</body>
</html>
