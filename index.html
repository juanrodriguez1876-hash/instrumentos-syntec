<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | Instrumentos Sintek</title>
  <link rel="stylesheet" href="estilos.css">
  <script src="layout.js"></script>
</head>
<body class="pagina-login">
  <header class="barra">
    
    <svg class="logo" viewBox="0 0 64 72" role="img" aria-label="Logo Instrumentos Sintek">
      <path d="M32 2C14 2 4 14 4 30c0 16 16 30 28 40 12-10 28-24 28-40C60 14 50 2 32 2Z" fill="#0b1f4b"/>
      <text x="32" y="40" text-anchor="middle" font-size="22" font-weight="600" fill="#fff" font-family="Oswald, Arial, sans-serif">IS</text>
    </svg>
  </header>
  <main class="contenido">
    <section class="tarjeta-login">
      <span class="nota-tarjeta" aria-hidden="true">&#9835;</span>
      <h1 class="titulo titulo--centro">Bienveni@</h1>
      <a href="piano.html" class="btn-piano">🎹 Abrir Piano</a>
      <form action="inicio.html" method="get">
        <div class="campo"><label for="usuario">Usuario</label><input type="text" id="usuario" name="usuario" required></div>
        <div class="campo"><label for="contrasena">Contraseña</label><input type="password" id="contrasena" name="contrasena" required></div>
        <p class="enlace-centrado"><a href="recuperar-contrasena.html">¿Olvidaste tu contraseña?</a></p>
        <div class="acciones">
          <button type="submit" class="boton">Login</button>
          <a href="crear-cuenta.html" class="boton boton--contorno">Registrar cuenta</a>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
