<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrar cliente | Instrumentos Sintek</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
  <script src="layout.js"></script>
</head>
<body>

  <main class="contenido">
    <h1 class="titulo">Registrar cliente</h1>

    <!-- Sirve también para EDITAR: el backend lo llena con los datos del cliente (?id=...).
         En Registrar venta habrá un enlace "Registrar cliente nuevo" que abre esta pantalla. -->
    <form class="formulario formulario--doble" action="clientes.html" method="get">
      <p class="nota-campos"><span class="requerido" aria-hidden="true">*</span> Campos obligatorios</p>
      <div class="campo campo--ancho"><label for="nombre">Nombre completo <span class="requerido" aria-hidden="true">*</span></label><input type="text" id="nombre" name="nombre" placeholder="Nombre y apellidos" required autocomplete="name"></div>
      <div class="campo"><label for="telefono">Teléfono <span class="requerido" aria-hidden="true">*</span></label><input type="tel" id="telefono" name="telefono" placeholder="10 dígitos" required inputmode="tel" pattern="[0-9]{10,15}" maxlength="15"><small>Solo números.</small></div>
      <div class="campo"><label for="correo">Correo electrónico</label><input type="email" id="correo" name="correo" placeholder="correo@ejemplo.com" autocomplete="email"></div>
      <div class="campo campo--ancho"><label for="direccion">Dirección</label><input type="text" id="direccion" name="direccion" placeholder="Calle, número y colonia"></div>
      <div class="acciones">
        <a href="clientes.html" class="boton boton--contorno">Cancelar</a>
        <button type="submit" class="boton">Guardar cliente</button>
      </div>
    </form>
  </main>

</body>
</html>
