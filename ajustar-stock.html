<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ajustar stock | Instrumentos Sintek</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
  <script src="layout.js"></script>
</head>
<body>

  <main class="contenido">
    <h1 class="titulo">Ajustar stock</h1>

    <!-- Regla: el stock nunca queda negativo. Cada ajuste se guardará en una bitácora (quién, cuándo y por qué). -->
    <form class="formulario formulario--doble" action="existencias.html" method="get">
      <p class="nota-campos"><span class="requerido" aria-hidden="true">*</span> Campos obligatorios</p>
      <div class="campo campo--ancho"><label for="producto">Producto <span class="requerido" aria-hidden="true">*</span></label><select id="producto" name="producto" required><option value="" disabled selected>Selecciona un producto</option><option value="1">Guitarra eléctrica</option><option value="2">Guitarra acústica</option><option value="3">Saxofón alto</option></select></div>
      <div class="comparacion campo--ancho" aria-live="polite">
        <div><span>Stock actual</span><b>15</b></div>
        <div><span>Stock después del ajuste</span><b>18</b></div>
      </div>
      <div class="campo"><label id="tipo-et">Tipo de movimiento <span class="requerido" aria-hidden="true">*</span></label>
        <div class="opciones" role="radiogroup" aria-labelledby="tipo-et">
          <label><input type="radio" name="tipo" value="entrada" checked> Entrada</label>
          <label><input type="radio" name="tipo" value="salida"> Salida</label>
          <label><input type="radio" name="tipo" value="correccion"> Corrección</label>
        </div></div>
      <div class="campo"><label for="cantidad">Cantidad <span class="requerido" aria-hidden="true">*</span></label><input type="number" id="cantidad" name="cantidad" required min="1" value="3"><small>Una salida no puede dejar el stock en negativo.</small></div>
      <div class="campo campo--ancho"><label for="motivo">Motivo <span class="requerido" aria-hidden="true">*</span></label><select id="motivo" name="motivo" required><option value="" disabled selected>Selecciona un motivo</option><option value="conteo">Conteo físico</option><option value="danado">Producto dañado</option><option value="devolucion">Devolución de cliente</option><option value="otro">Otro</option></select></div>
      <div class="campo campo--ancho"><label for="nota">Nota (opcional)</label><input type="text" id="nota" name="nota" placeholder="Detalle del ajuste"></div>
      <div class="acciones">
        <a href="existencias.html" class="boton boton--contorno">Cancelar</a>
        <button type="submit" class="boton">Guardar ajuste</button>
      </div>
    </form>
  </main>

</body>
</html>
